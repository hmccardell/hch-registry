# Render Blueprint — deploys the registry as one Node web service.
#
# The build compiles the React frontend; the service then serves that bundle
# from the same Express process that exposes the API, all under one base path
# (/registry), so there is a single origin and no CORS to configure.
#
# This project lives in a subdirectory of the HCH website repo, so `rootDir`
# points Render at it and the build/start commands run from there. Either keep
# this as its own service and reverse-proxy `/registry/*` to it from the main
# site (WITHOUT stripping the prefix — the app owns the whole /registry path),
# or fold these keys into the site's own render.yaml as a second service.
#
# On the first deploy, Render prompts for every var below marked `sync: false`:
# SUPABASE_* from the Supabase dashboard (see the README), PUBLIC_URL (the
# browser-facing URL of the registry), and SMTP_URL (a transactional-email
# provider). REGISTRY_AUTH_SECRET is generated for you.
services:
  - type: web
    name: hch-registry
    runtime: node
    plan: free
    rootDir: registry
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /registry/health
    envVars:
      - key: NODE_ENV
        value: production
      # Override only if the reverse proxy serves the registry at a different
      # path. Must match `base` in frontend/vite.config.js at build time.
      - key: BASE_PATH
        value: /registry
      # Browser-facing URL of the registry — used to build the sign-in link in
      # the email. Set to wherever members actually reach it.
      - key: PUBLIC_URL
        sync: false
      # Signs magic-link and session tokens.
      - key: REGISTRY_AUTH_SECRET
        generateValue: true
      # Transactional email as one SMTP URL, e.g.
      #   smtps://apikey:re_xxx@smtp.resend.com:465
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: HCH Registry <no-reply@hubcityhackers.com>
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
