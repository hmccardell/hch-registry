# Render Blueprint — deploys the registry as one Node web service.
#
# The build compiles the React frontend; the service then serves that bundle
# from the same Express process that exposes /api, so there is a single origin
# and no CORS to configure.
#
# On the first deploy, Render prompts for every var below marked `sync: false`.
# Get GOOGLE_* from the service-account JSON (see the README), and pick an
# AUTH_PASSWORD. AUTH_SECRET is generated for you.
services:
  - type: web
    name: hch-registry
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_USER
        value: hch
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_RANGE
        value: Form Responses 1
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
